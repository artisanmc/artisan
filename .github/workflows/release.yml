name: Release

# A tag v<version> (`v1.0.50`) builds the plugin with its editor, then sign-release.yml (the
# workflow every plugin of the suite calls) signs the jar with the organization secret
# ARTISAN_SIGNING_KEY and publishes it with release.json on the tag's GitHub Release.
# `/artisan update` downloads both and checks the signature against the keys Artisan pins
# (ReleaseKeys).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
        working-directory: editor
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test :artisan-paper:shadowJar -PwithEditor -PartisanVersion="${GITHUB_REF_NAME#v}" --no-daemon
        working-directory: plugin
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: plugin/paper/build/libs/artisan-plugin-*-all.jar
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/sign-release.yml
    secrets: inherit
