name: Release jars

# The two plugin jars from one revision (docs/architecture/editions.md): `Artisan-<v>.jar`
# (free: Modrinth, Hangar, Spigot, free listings) and `Artisan-Pro-<v>.jar` (paid listings on
# BuiltByBit, Polymart, Voxel). Both embed the editor. A tag `v<version>` makes a draft GitHub
# Release carrying them; a manual run only keeps them as workflow artifacts.
#
# Publication (tag only, job `publish`, GitHub environment `release`): the free jar goes to
# Modrinth and Hangar, the Pro jar to Voxel (ex-Polymart). Notes: the tag's annotation. A platform
# whose token is not set is skipped. SpigotMC and BuiltByBit have no upload API: upload by hand
# from the draft Release. Setup: deploy/README.md, "Releasing the plugin".
#
# Early access (a Pro perk): each push to `v2` or `main` builds `<last tag>-dev.<run>` and
# replaces the assets of the `dev` pre-release, to hand to Pro buyers. Free users get tags only.
on:
  push:
    tags: ["v*"]
    branches: [v2, main]
    paths:
      - plugin/**
      - editor/**
      - docs/schema/**
      - .github/workflows/release-jars.yml
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (e.g. 2.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-jars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            VERSION="${LAST#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "bad version '$VERSION'" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: editor
      - name: Test
        working-directory: plugin
        run: bash ./gradlew test --no-daemon
      # Two builds of the same revision: only `artisan-edition.properties` and the jar name differ.
      - name: Build both jars
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          for EDITION in free pro; do
            bash ./gradlew :artisan-paper:shadowJar -PwithEditor -Pedition="$EDITION" -PartisanVersion="$VERSION" --no-daemon
          done
          cp "paper/build/libs/artisan-plugin-$VERSION-free.jar" "../dist/Artisan-$VERSION.jar"
          cp "paper/build/libs/artisan-plugin-$VERSION-all.jar" "../dist/Artisan-Pro-$VERSION.jar"
      - name: Check each jar says its edition
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          check() {
            got="$(unzip -p "$1" artisan-edition.properties | tr -d '\r')"
            [ "$got" = "edition=$2" ] || { echo "$1: '$got', expected edition=$2" >&2; exit 1; }
            unzip -l "$1" editor/index.html > /dev/null || { echo "$1 does not embed the editor" >&2; exit 1; }
          }
          check "dist/Artisan-$VERSION.jar" free
          check "dist/Artisan-Pro-$VERSION.jar" pro
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-jars-${{ steps.version.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar --draft --verify-tag \
            --title "Artisan $VERSION" \
            --notes "Artisan-$VERSION.jar: free edition. Artisan-Pro-$VERSION.jar: Pro edition (paid listings only, never public)."
      # One rolling pre-release, never marked latest: only its assets change.
      - name: Early access build
        if: github.ref_type == 'branch' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view dev > /dev/null 2>&1; then
            gh release create dev --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Artisan early access" --notes "Development builds for Artisan Pro early access. Not for production."
          fi
          for old in $(gh release view dev --json assets --jq '.assets[].name'); do gh release delete-asset dev "$old" --yes; done
          gh release upload dev dist/*.jar
          gh release edit dev --title "Artisan early access ($VERSION)" --notes "Built from $GITHUB_SHA on $GITHUB_REF_NAME. Development build for Artisan Pro early access, not for production."

  publish:
    needs: jars
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect it (Settings > Environments > release): tags `v*` only, and a required reviewer to
    # check the draft Release before anything goes public.
    environment: release
    permissions:
      contents: read
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
      HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
      VOXEL_API_KEY: ${{ secrets.VOXEL_API_KEY }}
      VOXEL_RESOURCE_ID: ${{ vars.VOXEL_PRO_RESOURCE_ID }}
      MINECRAFT_VERSIONS: ${{ vars.MINECRAFT_VERSIONS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v4
        with:
          name: artisan-jars-${{ needs.jars.outputs.version }}
          path: dist
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -n "$notes" ] || { echo "Tag $GITHUB_REF_NAME has no message: use git tag -a" >&2; exit 1; }
          { echo "RELEASE_NOTES<<__NOTES__"; echo "$notes"; echo "__NOTES__"; } >> "$GITHUB_ENV"
      - name: Publish the free jar to Modrinth
        if: env.MODRINTH_TOKEN != ''
        working-directory: plugin
        env:
          VERSION: ${{ needs.jars.outputs.version }}
        run: |
          args=(-PartisanVersion="$VERSION" -PreleaseJar="../dist/Artisan-$VERSION.jar")
          [ -n "$MINECRAFT_VERSIONS" ] && args+=(-PminecraftVersions="$MINECRAFT_VERSIONS")
          bash ./gradlew :artisan-paper:modrinth "${args[@]}" --no-daemon
      - name: Publish the free jar to Hangar
        if: env.HANGAR_API_TOKEN != ''
        working-directory: plugin
        env:
          VERSION: ${{ needs.jars.outputs.version }}
        run: |
          args=(-PartisanVersion="$VERSION" -PreleaseJar="../dist/Artisan-$VERSION.jar")
          [ -n "$MINECRAFT_VERSIONS" ] && args+=(-PminecraftVersions="$MINECRAFT_VERSIONS")
          bash ./gradlew :artisan-paper:publishPluginPublicationToHangar "${args[@]}" --no-daemon
      # https://voxel.shop/wiki/api (postUpdate). The key needs the "Post Updates" permission.
      - name: Publish the Pro jar to Voxel
        if: env.VOXEL_API_KEY != '' && env.VOXEL_RESOURCE_ID != ''
        env:
          VERSION: ${{ needs.jars.outputs.version }}
        run: |
          beta=0
          case "$VERSION" in *-*) beta=1 ;; esac
          answer="$(curl -sS --fail-with-body https://api.voxel.shop/v1/postUpdate \
            -F "api_key=$VOXEL_API_KEY" -F "resource_id=$VOXEL_RESOURCE_ID" \
            -F "version=$VERSION" -F "title=Artisan Pro $VERSION" -F "message=$RELEASE_NOTES" \
            -F "beta=$beta" -F "file=@dist/Artisan-Pro-$VERSION.jar")"
          echo "$answer"
          echo "$answer" | jq -e '.response.success == true or .success == true' > /dev/null
