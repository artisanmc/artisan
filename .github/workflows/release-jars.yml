name: Release jars

# The plugin jar, `Artisan-<v>.jar`, editor embedded: one paid jar, the same on every store. The
# repository is public, so the jar is never: a tag `v<version>` makes a **draft** GitHub Release
# carrying it (drafts are visible to maintainers only, never publish it), and the workflow artifact
# is kept one day.
#
# Publication (tag only, job `publish`, GitHub environment `release`): Voxel. Notes: the tag's
# annotation. SpigotMC and BuiltByBit have no upload API: upload by hand from the draft Release.
# Setup: deploy/README.md, "Releasing the plugin".
#
# Pushes to `v2` or `main` build `<last tag>-dev.<run>` as a check only, nothing is uploaded.
on:
  push:
    tags: ["v*"]
    branches: [v2, main]
    paths:
      - plugin/**
      - editor/**
      - docs/schema/**
      - .github/workflows/release-jars.yml
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (e.g. 1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-jars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            VERSION="${LAST#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "bad version '$VERSION'" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: editor
      - name: Test
        working-directory: plugin
        run: bash ./gradlew test --no-daemon
      - name: Build the jar
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          bash ./gradlew :artisan-paper:shadowJar -PwithEditor -PartisanVersion="$VERSION" --no-daemon
          cp "paper/build/libs/artisan-plugin-$VERSION-all.jar" "../dist/Artisan-$VERSION.jar"
      - name: Check the jar embeds the editor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          unzip -l "dist/Artisan-$VERSION.jar" editor/index.html > /dev/null \
            || { echo "Artisan-$VERSION.jar does not embed the editor" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-jars-${{ steps.version.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 1
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar --draft --verify-tag \
            --title "Artisan $VERSION" \
            --notes "Artisan-$VERSION.jar: the plugin, editor included."

  publish:
    needs: jars
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect it (Settings > Environments > release): tags `v*` only, and a required reviewer to
    # check the draft Release before anything goes public.
    environment: release
    permissions:
      contents: read
    env:
      VOXEL_API_KEY: ${{ secrets.VOXEL_API_KEY }}
      VOXEL_RESOURCE_ID: ${{ vars.VOXEL_RESOURCE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: artisan-jars-${{ needs.jars.outputs.version }}
          path: dist
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -n "$notes" ] || { echo "Tag $GITHUB_REF_NAME has no message: use git tag -a" >&2; exit 1; }
          { echo "RELEASE_NOTES<<__NOTES__"; echo "$notes"; echo "__NOTES__"; } >> "$GITHUB_ENV"
      # https://voxel.shop/wiki/api (postUpdate). The key needs the "Post Updates" permission.
      - name: Publish to Voxel
        if: env.VOXEL_API_KEY != '' && env.VOXEL_RESOURCE_ID != ''
        env:
          VERSION: ${{ needs.jars.outputs.version }}
        run: |
          beta=0
          case "$VERSION" in *-*) beta=1 ;; esac
          answer="$(curl -sS --fail-with-body https://api.voxel.shop/v1/postUpdate \
            -F "api_key=$VOXEL_API_KEY" -F "resource_id=$VOXEL_RESOURCE_ID" \
            -F "version=$VERSION" -F "title=Artisan $VERSION" -F "message=$RELEASE_NOTES" \
            -F "beta=$beta" -F "file=@dist/Artisan-$VERSION.jar")"
          echo "$answer"
          echo "$answer" | jq -e '.response.success == true or .success == true' > /dev/null
