name: schema
on:
  push: { branches: [main] }
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: install editor deps
        working-directory: editor
        run: npm ci
      - name: ajv validation
        working-directory: editor
        run: npx vitest run src/schema/validateMenuV1.test.ts
