name: Plugin

# Split from ci.yml so it only starts when the plugin's inputs change (private
# repository: every runner minute counts). The conformance tests read testdata/ and
# docs/schema/, the api module reads docs/architecture/api-surface.md.
on:
  push:
    branches: [main]
    paths:
      - plugin/**
      - testdata/**
      - docs/schema/**
      - docs/architecture/api-surface.md
      - .github/workflows/plugin.yml
  pull_request:
    paths:
      - plugin/**
      - testdata/**
      - docs/schema/**
      - docs/architecture/api-surface.md
      - .github/workflows/plugin.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test shadowJar publishCoreApiPublicationToMavenLocal --no-daemon
