name: API version

# A PR touching the public API sources must raise the highest `Since` version in
# docs/architecture/api-surface.md above the last release: that is the version
# publish-api.yml publishes on merge. Exemption (KDoc, formatting): label
# `api:no-release`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Only the PRs the check can fail: it reads nothing else.
    paths:
      - plugin/api/src/main/**
      - docs/architecture/api-surface.md
      - deploy/api-version.mjs

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node deploy/api-version.mjs check "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
