name: API version

# Une PR qui touche les sources de l'API publique doit monter la plus haute version
# `Since` de docs/architecture/api-surface.md au-dessus de la dernière release : c'est
# elle que publish-api.yml publiera au merge. Exemption (KDoc, formatage) : label
# `api:no-release`.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node deploy/api-version.mjs check "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
