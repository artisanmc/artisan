name: Sign release

# Shared by every plugin of the suite: each repository builds its jar, uploads it as an
# artifact, then calls this workflow on its `v<version>` tag:
#
#   publish:
#     needs: build
#     permissions:
#       contents: write
#     uses: artisanmc/artisan/.github/workflows/sign-release.yml@v2
#     secrets: inherit
#
# It signs the jar with the organization secret ARTISAN_SIGNING_KEY (Ed25519, PEM) and
# publishes it with release.json ({plugin, version, sha256, signature}, signature over
# "artisan-release\n<plugin>\n<version>\n<sha256>") on the caller's own GitHub Release.
# `/artisan update` checks that signature against the public keys Artisan pins (ReleaseKeys).
# Only the tag ruleset of the organization decides who may publish: no approval step.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact holding the one jar to publish.
        type: string
        default: jar
    secrets:
      ARTISAN_SIGNING_KEY:
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: Sign
        env:
          ARTISAN_SIGNING_KEY: ${{ secrets.ARTISAN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one jar in the artifact, found ${#jars[@]}" >&2
            exit 1
          fi
          jar="${jars[0]}"
          expected="${GITHUB_REF_NAME#v}"

          descriptor=$(unzip -p "$jar" plugin.yml 2>/dev/null || unzip -p "$jar" paper-plugin.yml)
          field() { printf '%s\n' "$descriptor" | sed -n "s/^$1:[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*$/\1/p" | head -n 1; }
          plugin=$(field name)
          version=$(field version)
          if [ -z "$plugin" ] || [ "$version" != "$expected" ]; then
            echo "The jar says name '$plugin', version '$version'; the release is $expected" >&2
            exit 1
          fi

          sha=$(sha256sum "$jar" | cut -d ' ' -f 1)
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$ARTISAN_SIGNING_KEY" > "$work/key.pem"
          printf 'artisan-release\n%s\n%s\n%s' "$plugin" "$version" "$sha" > "$work/message"
          openssl pkeyutl -sign -inkey "$work/key.pem" -rawin -in "$work/message" -out "$work/signature"
          # The signature checks against the key's own public half before anything is published.
          openssl pkey -in "$work/key.pem" -pubout -out "$work/public.pem"
          openssl pkeyutl -verify -pubin -inkey "$work/public.pem" -rawin -in "$work/message" -sigfile "$work/signature" >/dev/null

          jq -n --arg plugin "$plugin" --arg version "$version" --arg sha256 "$sha" \
            --arg signature "$(base64 -w 0 "$work/signature")" \
            '{plugin: $plugin, version: $version, sha256: $sha256, signature: $signature}' \
            > dist/release.json
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          echo "Signed $plugin $version ($sha)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar dist/release.json --repo "$GITHUB_REPOSITORY" --title "$PLUGIN $GITHUB_REF_NAME" --generate-notes
