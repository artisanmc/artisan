name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Historique complet : publish-plugin.mjs compare plugin/ à la release servie.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reject stale CI runs
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing stale deployment: validated SHA is not current main" >&2
            exit 1
          fi

      - name: Deploy through Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_BACKEND_UUID: ${{ vars.COOLIFY_BACKEND_UUID }}
          COOLIFY_EDITOR_UUID: ${{ vars.COOLIFY_EDITOR_UUID }}
          API_HEALTH_URL: https://api.artisanmc.net/health
          EDITOR_HEALTH_URL: https://editor.artisanmc.net/health
          MARKETING_HEALTH_URL: https://artisanmc.net/
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node deploy/coolify-deploy.mjs

      # Le JAR du plugin est servi par le backend (dépôt privé : les serveurs ne
      # peuvent pas lire GitHub) et signé ici ; cf. deploy/README.md.
      - name: Check plugin release
        id: plugin
        env:
          API_URL: https://api.artisanmc.net
        run: node deploy/publish-plugin.mjs check

      - name: Set up Java
        if: steps.plugin.outputs.needed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build plugin
        if: steps.plugin.outputs.needed == 'true'
        working-directory: plugin
        run: bash ./gradlew shadowJar --no-daemon -PartisanVersion=1.0.${{ github.event.workflow_run.run_number }}

      - name: Publish plugin release
        if: steps.plugin.outputs.needed == 'true'
        env:
          API_URL: https://api.artisanmc.net
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_VERSION: 1.0.${{ github.event.workflow_run.run_number }}
          PLUGIN_JAR: plugin/build/libs/artisan-plugin-1.0.${{ github.event.workflow_run.run_number }}-all.jar
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node deploy/publish-plugin.mjs publish
