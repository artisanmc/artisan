name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main → production, staging → staging : chaque environnement GitHub porte ses UUIDs Coolify.
    environment: ${{ github.event.workflow_run.head_branch == 'staging' && 'staging' || 'production' }}
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      API_URL: ${{ github.event.workflow_run.head_branch == 'staging' && 'https://staging-api.artisanmc.net' || 'https://api.artisanmc.net' }}
      EDITOR_URL: ${{ github.event.workflow_run.head_branch == 'staging' && 'https://staging-editor.artisanmc.net' || 'https://editor.artisanmc.net' }}
      MARKETING_URL: ${{ github.event.workflow_run.head_branch == 'staging' && 'https://staging.artisanmc.net' || 'https://artisanmc.net' }}
      # Canal du plugin : la signature couvre la version, un JAR `-staging` n'est jamais accepté en prod.
      PLUGIN_VERSION: 1.0.${{ github.event.workflow_run.run_number }}${{ github.event.workflow_run.head_branch == 'staging' && '-staging' || '' }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Historique complet : publish-plugin.mjs compare plugin/ à la release servie.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reject stale CI runs
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing stale deployment: validated SHA is not current $BRANCH" >&2
            exit 1
          fi

      - name: Deploy through Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_BACKEND_UUID: ${{ vars.COOLIFY_BACKEND_UUID }}
          COOLIFY_EDITOR_UUID: ${{ vars.COOLIFY_EDITOR_UUID }}
          API_HEALTH_URL: ${{ env.API_URL }}/health
          EDITOR_HEALTH_URL: ${{ env.EDITOR_URL }}/health
          MARKETING_HEALTH_URL: ${{ env.MARKETING_URL }}/
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node deploy/coolify-deploy.mjs

      # Le JAR du plugin est servi par le backend (dépôt privé : les serveurs ne
      # peuvent pas lire GitHub) et signé ici ; cf. deploy/README.md.
      - name: Check plugin release
        id: plugin
        run: node deploy/publish-plugin.mjs check

      - name: Set up Java
        if: steps.plugin.outputs.needed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build plugin
        if: steps.plugin.outputs.needed == 'true'
        working-directory: plugin
        run: bash ./gradlew shadowJar --no-daemon -PartisanVersion=$PLUGIN_VERSION

      - name: Publish plugin release
        if: steps.plugin.outputs.needed == 'true'
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_JAR: plugin/build/libs/artisan-plugin-${{ env.PLUGIN_VERSION }}-all.jar
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node deploy/publish-plugin.mjs publish
