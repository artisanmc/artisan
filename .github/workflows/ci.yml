name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            docs-site/package-lock.json
      - run: node --test deploy/*.test.mjs
      - run: npm ci
        working-directory: editor
      - run: npm ci
        working-directory: docs-site
      - run: npm test -- --run
        working-directory: editor
      - run: npm run build
        working-directory: editor
        env:
          VITE_API_URL: https://api.artisanmc.net
          VITE_PLUGIN_WS_URL: wss://api.artisanmc.net/ws/plugin
          VITE_EDITOR_URL: https://editor.artisanmc.net
      - run: npm run verify
        working-directory: docs-site

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test shadowJar publishCoreApiPublicationToMavenLocal --no-daemon
