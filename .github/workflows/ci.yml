name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `biome format --changed` diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            docs-site/package-lock.json
      - run: node --test deploy/*.test.mjs
      - run: npm ci
        working-directory: editor
      - run: npm ci
        working-directory: docs-site
      # The build only typechecks tsconfig.app.json (no tests): tsc -b covers the tests too.
      - run: npm run typecheck
        working-directory: editor
      - run: npx biome lint .
        working-directory: editor
      - run: npm run check:boundaries
        working-directory: editor
      # Formatting is enforced on the files a PR touches, so the backlog shrinks without
      # one repository-wide reformat that would conflict with every open branch.
      - if: github.event_name == 'pull_request'
        run: npx biome format --changed --no-errors-on-unmatched --since=origin/${{ github.base_ref }}
        working-directory: editor
      - run: npm test -- --run
        working-directory: editor
      # Self-hosted editor (embedded in the plugin), then the artisanmc.net showcase + wiki.
      - run: npm run build
        working-directory: editor
      - run: npm run build:site
        working-directory: editor
      - run: npm run verify
        working-directory: docs-site

  editor-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: editor/test-results/

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test shadowJar publishCoreApiPublicationToMavenLocal --no-daemon
