name: CI

# Editor, showcase and wiki. The plugin lives in plugin.yml: each workflow only starts
# when its own inputs change, since the repository is private and every runner minute
# counts against the organization's quota. v2 gets no post-merge run: each PR is
# already tested on its merge ref, and main keeps one because deploy.yml waits on it.
# Keep both paths lists (push, pull_request) in sync with what the editor and the deploy
# tests read.
on:
  push:
    branches: [main]
    paths:
      - editor/**
      - docs-site/**
      - deploy/**
      - testdata/**
      - docs/schema/**
      - docs/architecture/api-surface.md
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - editor/**
      - docs-site/**
      - deploy/**
      - testdata/**
      - docs/schema/**
      - docs/architecture/api-surface.md
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # `biome format --changed` diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            docs-site/package-lock.json
      - run: node --test deploy/*.test.mjs
      - run: npm ci
        working-directory: editor
      - run: npm ci
        working-directory: docs-site
      # The build only typechecks tsconfig.app.json (no tests): tsc -b covers the tests too.
      - run: npm run typecheck
        working-directory: editor
      - run: npx biome lint .
        working-directory: editor
      - run: npm run check:boundaries
        working-directory: editor
      # Formatting is enforced on the files a PR touches, so the backlog shrinks without
      # one repository-wide reformat that would conflict with every open branch.
      - if: github.event_name == 'pull_request'
        run: npx biome format --changed --no-errors-on-unmatched --since=origin/${{ github.base_ref }}
        working-directory: editor
      - run: npm test -- --run
        working-directory: editor
      # e2e smoke in this job rather than its own: no second runner, npm ci and per-job
      # minute rounding.
      - run: npx playwright install --with-deps chromium
        working-directory: editor
      - run: npm run test:e2e
        working-directory: editor
      # Self-hosted editor (embedded in the plugin), then the artisanmc.net showcase + wiki.
      - run: npm run build
        working-directory: editor
      - run: npm run build:site
        working-directory: editor
      - run: npm run verify
        working-directory: docs-site
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: editor/test-results/
