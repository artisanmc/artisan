name: Publish API

# Version source : la plus haute version `Since` de docs/architecture/api-surface.md
# (deploy/api-version.mjs). Au-dessus du dernier tag api-vX.Y.Z → release X.Y.Z
# (/releases, puis tag + GitHub Release créés ici). Sinon → snapshot de la mineure
# suivante (/snapshots). Aucun tag à poser à la main.
on:
  push:
    branches: [main]
    paths:
      - plugin/api/**
      - plugin/build.gradle.kts
      - docs/architecture/api-surface.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve API version
        id: plan
        run: node deploy/api-version.mjs plan
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test --no-daemon
        working-directory: plugin
      - name: Publish to repo.artisanmc.net
        working-directory: plugin
        env:
          ORG_GRADLE_PROJECT_artisanRepoUsername: ${{ secrets.ARTISAN_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_artisanRepoPassword: ${{ secrets.ARTISAN_REPO_PASSWORD }}
          API_VERSION: ${{ steps.plan.outputs.version }}
        run: bash ./gradlew publishCoreApiPublicationToArtisanRepoRepository -PapiVersion="$API_VERSION" --no-daemon
      - name: Tag and GitHub Release
        if: steps.plan.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          API_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "api-v$API_VERSION" --target "$GITHUB_SHA" \
            --title "Artisan API $API_VERSION" \
            --notes "\`net.artisanmc:artisan-core-api:$API_VERSION\` on https://repo.artisanmc.net/releases. Members and their \`Since\` version: docs/architecture/api-surface.md."
