name: Publish API

on:
  push:
    branches: [main]
    paths:
      - plugin/src/main/kotlin/net/artisanmc/modules/api/**
      - plugin/build.gradle.kts
    tags: ["api-v*"]

permissions:
  contents: read

concurrency:
  group: publish-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test --no-daemon
      # Tag api-vX.Y.Z → releases/X.Y.Z ; push sur main → snapshots/1.0.0-SNAPSHOT.
      - name: Publish to repo.artisanmc.net
        env:
          ORG_GRADLE_PROJECT_artisanRepoUsername: ${{ secrets.ARTISAN_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_artisanRepoPassword: ${{ secrets.ARTISAN_REPO_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == api-v* ]]; then
            bash ./gradlew publishCoreApiPublicationToArtisanRepoRepository -PapiVersion="${REF_NAME#api-v}" --no-daemon
          else
            bash ./gradlew publishCoreApiPublicationToArtisanRepoRepository --no-daemon
          fi
