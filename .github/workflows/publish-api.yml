name: Publish API

# Publishes net.artisanmc:artisan-core-api to repo.artisanmc.net (deploy/reposilite/README.md).
#   tag api-vX.Y.Z -> releases/ X.Y.Z (SemVer of the public API, versioning.md §3.3)
#   push to main   -> snapshots/ 1.0.0-SNAPSHOT, when the API or its build changes
# Secrets: ARTISAN_REPO_USERNAME / ARTISAN_REPO_PASSWORD (Reposilite token with write access).

on:
  push:
    tags: ['api-v*']
    branches: [main]
    paths:
      - 'plugin/src/main/kotlin/net/artisanmc/modules/api/**'
      - 'plugin/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: publish-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/api-v* ]]; then
            VERSION="${GITHUB_REF_NAME#api-v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must be api-vX.Y.Z, got $GITHUB_REF_NAME"
              exit 1
            fi
            echo "args=-PapiVersion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and publish
        env:
          ORG_GRADLE_PROJECT_artisanRepoUsername: ${{ secrets.ARTISAN_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_artisanRepoPassword: ${{ secrets.ARTISAN_REPO_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_artisanRepoPassword" ]; then
            echo "::error::Missing secrets ARTISAN_REPO_USERNAME / ARTISAN_REPO_PASSWORD"
            exit 1
          fi
          bash ./gradlew --no-daemon test publishCoreApiPublicationToArtisanRepoRepository ${{ steps.version.outputs.args }}
