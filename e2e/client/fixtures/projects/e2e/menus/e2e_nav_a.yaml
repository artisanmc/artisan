schema: menu/v1
id: e2e_nav_a
title: "E2E nav A"
size: 27
player_inventory: hidden
elements:
  - id: fill
    positions: "0-62"
    material: COBBLESTONE
    title: "A"
  - id: to_b
    positions: 0
    material: ARROW
    title: "To B"
    click:
      left: open_menu e2e_nav_b
  - id: back
    positions: 8
    material: BARRIER
    title: "Back"
    click:
      left: open_previous_menu
  - id: history
    positions: 26
    material: COAL
    title: "No previous menu"
    states:
      - if: [{ type: expression, expr: has_previous_menu }]
        material: EMERALD
        title: "Has previous menu"
