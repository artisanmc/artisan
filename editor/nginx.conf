server {
  listen 80;
  server_name ${MARKETING_HOST};
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /health { return 200 "ok"; }
  location = / { try_files /index.html =404; }
  location = /pricing { try_files /index.html =404; }
  location = /pricing/ { return 308 /pricing$is_args$args; }

  location = /wiki {
    return 308 /wiki/$is_args$args;
  }

  location ^~ /wiki/ {
    try_files $uri $uri/ =404;
    error_page 404 /wiki/404.html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri @editor_redirect;
  }

  location @editor_redirect {
    return 308 https://${EDITOR_HOST}$request_uri;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /health { return 200 "ok"; }
  location = / { return 308 https://${MARKETING_HOST}$request_uri; }
  location = /pricing { return 308 https://${MARKETING_HOST}$request_uri; }
  location = /pricing/ { return 308 https://${MARKETING_HOST}/pricing$is_args$args; }
  location = /wiki { return 308 https://${MARKETING_HOST}$request_uri; }
  location ^~ /wiki/ { return 308 https://${MARKETING_HOST}$request_uri; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
