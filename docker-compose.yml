services:
  # Boutique add-on's own MySQL (Azuriom shop schema) — separate from Artisan's
  # own database. Boutique creates its tables on enable; a fresh empty DB is fine.
  boutique-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: boutique
      MYSQL_USER: boutique
      MYSQL_PASSWORD: boutique
      MYSQL_ROOT_PASSWORD: boutique
    volumes:
      - boutique-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uboutique", "-pboutique"]
      interval: 5s
      timeout: 5s
      retries: 15

  minecraft:
    # Minecraft 26.1+ exige Java 25.
    image: itzg/minecraft-server:java25
    volumes:
      - ./docker/server:/data
    ports:
      - "25565:25565"
      # Éditeur servi par le plugin (web.port).
      - "8765:8765"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.2"
      MEMORY: 1G
      RCON_PASSWORD: local
      BROADCAST_RCON_TO_OPS: "false"
    depends_on:
      boutique-mysql:
        condition: service_healthy

volumes:
  boutique-mysql-data:
