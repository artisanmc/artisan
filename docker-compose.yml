services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interfaze
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interfaze
      # URL the browser uses to reach the API (publish bundles, etc.)
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      # URL the Minecraft plugin uses to download bundles (internal Docker network)
      BUNDLE_BASE_URL: ${BUNDLE_BASE_URL:-http://backend:3001}
    command: >
      sh -c "bun install && bun run db:push && bun run start"
    depends_on:
      postgres:
        condition: service_healthy

  editor:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./editor:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host"

  minecraft:
    build:
      context: .
      dockerfile: docker/minecraft.Dockerfile
    volumes:
      - mc-world:/server/world
      - mc-packs:/server/plugins/Interfaze/packs
    ports:
      - "25565:25565"
    environment:
      INTERFAZE_SERVER_KEY: ${INTERFAZE_SERVER_KEY:-}
      INTERFAZE_WS_URL: ${INTERFAZE_WS_URL:-ws://backend:3001/ws/plugin}
    depends_on:
      - backend

volumes:
  mc-world:
  mc-packs:
  pg-data:
