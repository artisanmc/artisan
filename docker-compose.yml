services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interfaze
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interfaze
      # URL the browser uses to reach the API (publish bundles, etc.)
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      # URL the Minecraft plugin uses to download bundles (internal Docker network)
      BUNDLE_BASE_URL: ${BUNDLE_BASE_URL:-http://backend:3001}
      # URL handed to player MC clients via setResourcePack — must be reachable
      # from the player's machine (NOT from inside the Docker network). Default:
      # API_BASE_URL fallback chain. Override for remote/public servers.
      RESOURCE_PACK_BASE_URL: ${RESOURCE_PACK_BASE_URL:-}
    command: >
      sh -c "bun install && bun run db:push && bun run start"
    depends_on:
      postgres:
        condition: service_healthy

  editor:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./editor:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host"

  minecraft:
    image: itzg/minecraft-server
    volumes:
      - ./docker/server:/data
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.11"
      MEMORY: 1G
      RCON_PASSWORD: local
      BROADCAST_RCON_TO_OPS: "false"
    depends_on:
      - backend

volumes:
  pg-data:
