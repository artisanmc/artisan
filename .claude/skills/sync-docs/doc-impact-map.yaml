# doc-impact-map.yaml — source of truth for which docs to update
# when which source files change. Used by the /sync-docs skill.
#
# Patterns: minimatch-style globs. ** = recursive wildcard.
#
# CLAUDE.md is a ROUTER, not a reference: it only holds commands, the three
# consequential pitfalls, the module import rule and the doc routing table.
# Only map to it when a change actually touches one of those. Everything else
# belongs in docs/architecture/*, CONTEXT.md or docs-site/.
# AGENTS.md mirrors CLAUDE.md: update both together.

mappings:
  # --- Plugin: user-visible surface ---

  - touches: "plugin/paper/src/main/resources/config.yml"
    updates:
      - "docs-site/src/content/docs/getting-started/install-admin.md"
    reason: "User-visible plugin config (Reference + Config sections)"

  - touches: "plugin/*/src/main/kotlin/**/PluginConfig.kt"
    updates:
      - "docs-site/src/content/docs/getting-started/install-admin.md"
    reason: "Plugin config schema / defaults"

  - touches: "plugin/*/src/main/kotlin/**/ArtisanCommand.kt"
    updates:
      - "docs/architecture/plugin-commands.md"
      - "docs-site/src/content/docs/getting-started/install-admin.md"
      - "CLAUDE.md"
      - "AGENTS.md"
    reason: "Commands: dev detail in plugin-commands.md, user table in install-admin, one-line list in CLAUDE.md"

  - touches: "plugin/*/src/main/kotlin/**/ResourcePackDelegator.kt"
    updates:
      - "docs-site/src/content/docs/getting-started/install-admin.md"
    reason: "Resource pack distribution modes (install-admin, Resource packs section)"

  # --- Plugin: sync, hashing, disk layout (the invariants) ---

  - touches: "plugin/*/src/main/kotlin/**/BundleHasher.kt"
    updates:
      - "docs/architecture/invariants.md"
      - "testdata/project-snapshot-hash-conformance.json"
    reason: "Snapshot hash — computed by the plugin only; keep byte-order sorting and regenerate the vector on purpose"

  - touches: "plugin/*/src/main/kotlin/**/yaml/LangFlattener.kt"
    updates:
      - "docs/architecture/project-files.md"
      - "testdata/lang-tree-conformance.json"
    reason: "lang/ tree reader — mirror of langTree.ts, locked by shared vector"

  - touches: "editor/src/lib/langTree.ts"
    updates:
      - "docs/architecture/project-files.md"
      - "testdata/lang-tree-conformance.json"
    reason: "lang/ tree writer (the only writer)"

  - touches: "plugin/*/src/main/kotlin/**/engine/KeyedStepParser.kt"
    updates:
      - "docs/architecture/testing.md"
      - "testdata/action-wire-conformance.json"
    reason: "Structured action wire reader — mirror of lib/actions/structuredSteps.ts, locked by shared vector"

  - touches: "editor/src/lib/actions/structuredSteps.ts"
    updates:
      - "docs/architecture/testing.md"
      - "testdata/action-wire-conformance.json"
    reason: "Structured action wire codec (the only writer) — locked by shared vector"

  - touches: "editor/src/domain/documentKinds.ts"
    updates:
      - "docs/architecture/project-files.md"
      - "docs/decisions/extensible-document-kinds.md"
    reason: "Document kind registry (editor): a kind's folder, id prefix and schema label decide the project layout"

  - touches: "editor/src/schema/documentCodecs.ts"
    updates:
      - "docs/architecture/project-files.md"
    reason: "Per-kind file codecs driving projectFromFiles and transform"

  - touches: "plugin/*/src/main/kotlin/**/model/DocumentKinds.kt"
    updates:
      - "docs/architecture/project-files.md"
      - "docs/decisions/extensible-document-kinds.md"
    reason: "Document kind registry (plugin) — Kotlin façade of the API's DocumentKindRegistry: folders, schema labels read by ProjectReader and ResourceInventory"

  - touches: "plugin/api/src/main/java/**/DocumentKind*.java"
    updates:
      - "docs/architecture/api-surface.md"
      - "docs/architecture/modules.md"
      - "docs/architecture/ws-protocol.md"
    reason: "Document kind contract of the module API (W6): declaration fields are the document_kinds wire"

  - touches: "editor/src/state/serverDocumentKindsStore.ts"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "Kinds the active server registers; drives the not-synchronised warning in the tree and NewDocumentDialog"

  - touches: "plugin/*/src/main/kotlin/**/model/ProjectBundle.kt"
    updates:
      - "docs/architecture/project-files.md"
    reason: "ProjectBundle.documents is the one store of a project's Documents; menus/commands/dialogs are its typed façade"

  - touches: "plugin/*/src/main/kotlin/**/I18nAddresses.kt"
    updates:
      - "docs/architecture/project-files.md"
      - "testdata/i18n-address-conformance.json"
    reason: "Canonical i18n addresses, derived on both sides"

  - touches: "editor/src/domain/actionArgs.ts"
    updates:
      - "testdata/action-wire-conformance.json"
      - "docs/architecture/testing.md"
      - "docs/architecture/editor-internals.md"
    reason: "Wire value ⇄ argument map rule (mirror of ActionDeclaration.normalize/canonical): the canonical form the editor writes is locked by the shared vector"

  - touches: "editor/src/features/canvas/properties/ActionEditor.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
      - "editor/src/locales/en.ts"
      - "editor/src/locales/fr.ts"
    reason: "Declaration-driven action form (W4): a new argument widget or label needs its i18n keys and its line in the internals doc"

  - touches: "editor/src/domain/actionTextSlots.ts"
    updates:
      - "testdata/i18n-address-conformance.json"
      - "docs/architecture/testing.md"
    reason: "Editor half of the action-text addressing (mirror of assignI18nAddresses), locked by the shared vector"

  - touches: "plugin/*/src/main/kotlin/**/engine/CoreActions.kt"
    updates:
      - "testdata/core-actions.json"
      - "docs/architecture/testing.md"
      - "docs/decisions/extensible-document-kinds.md"
    reason: "The core action vocabulary; the shared vector is generated from it (ARTISAN_WRITE_VECTORS=1) and imported by the editor"

  - touches: "tools/minecraft-assets/*.ts"
    updates:
      - "tools/minecraft-assets/README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
    reason: "Minecraft asset generators: what each script does and run order in the README, one-line pipeline in CLAUDE.md (Assets MC)"

  - touches: "editor/src/lib/pack/**"
    updates:
      - "testdata/resource-pack-conformance.json"
    reason: "The editor owns the pack builder and its byte-for-byte vector since the backend was removed: an intended zip change updates entries/sha1 in the same commit"

  # --- Module API surface (2 layers: plugin + editor) ---

  - touches: "plugin/api/src/main/"
    updates:
      - "docs/architecture/api-surface.md"
      - "docs/architecture/modules.md"
      - "CHANGELOG.md"
    reason: "Public module API — affects every module, must hit CHANGELOG + api-surface"

  - touches: "editor/packages/editor-sdk/src/**"
    updates:
      - "docs/architecture/modules.md"
      - "docs/architecture/editor-internals.md"
      - "docs/decisions/extensible-document-kinds.md"
    reason: "Frontend module API surface (@artisan/editor-sdk — FrontendModule, registerModule, DocumentKindContribution)"

  - touches: "editor/src/lib/moduleDocumentKinds.ts"
    updates:
      - "docs/architecture/editor-internals.md"
      - "docs/architecture/modules.md"
    reason: "Host side of FrontendModule.documents: how a contribution enters the kind table, the codecs and the visitors"

  - touches: "editor/src/domain/documentKindVisitors.ts"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "Per-kind text sites and chain slots: what translations, rekey, GC and edges can see of a Document"

  - touches: "editor/src/modules/*/*Kind.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "A core kind's contribution (menus, commands, dialogs) — the reference implementation of the kind contract"

  - touches: "editor/src/features/canvas/DocumentGroup.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "Generic board node of a module's kind: preview-only rule"

  # --- Hub (editor web server) and protocol ---

  - touches: "plugin/hub/src/main/kotlin/**/*Routes.kt"
    updates:
      - "docs/architecture/rest-endpoints.md"
    reason: "REST index points at the route file — add/remove/rename must be reflected"

  - touches: "plugin/hub/src/main/kotlin/**/{HubServer,EditorApi,Http,Relay}.kt"
    updates:
      - "docs/architecture/rest-endpoints.md"
    reason: "Route mounting, session/origin checks and relay status codes (Conventions section)"

  - touches: "plugin/hub/src/main/kotlin/**/{PluginChannel,RemoteServer,EditorChannel,Servers}.kt"
    updates:
      - "docs/architecture/ws-protocol.md"
    reason: "/ws/plugin and /ws/editor: hello fields read by the hub, relayed messages, server naming"

  - touches: "plugin/core/src/main/kotlin/**/protocol/**"
    updates:
      - "docs/architecture/ws-protocol.md"
    reason: "Message types, fields and handlers"

  - touches: "plugin/core/src/main/kotlin/**/protocol/ProtocolVersion.kt"
    updates:
      - "docs/architecture/ws-protocol.md"
      - "docs/architecture/versioning.md"
      - "CHANGELOG.md"
    reason: "Protocol version — a major bump stops hub and leaves from talking until both update"

  - touches: "plugin/paper/src/main/kotlin/**/ws/WsClient.kt"
    updates:
      - "docs/architecture/ws-protocol.md"
    reason: "Leaf client: hello payload, reconnection, editor_link"

  - touches: "plugin/hub/src/main/kotlin/**/{Sessions,WebConfig,PackStore,VanillaAssets}.kt"
    updates:
      - "docs/architecture/entities.md"
      - "docs-site/src/content/docs/getting-started/install-admin.md"
    reason: "What the hub keeps (sessions, packs, caches) and the web settings admins configure"

  - touches: "plugin/paper/src/main/kotlin/**/config/{EnvironmentFile,NetworkSecret}.kt"
    updates:
      - "docs-site/src/content/docs/getting-started/install-admin.md"
      - "docs/architecture/entities.md"
    reason: "environment.yml template (web.*, database) and network secret resolution"

  - touches: "plugin/core/src/main/kotlin/**/project/{ProjectDraftStore,ProjectPublisher,ProjectPathPolicy}.kt"
    updates:
      - "docs/architecture/invariants.md"
      - "docs/architecture/entities.md"
      - "docs/architecture/project-files.md"
    reason: "Drafts, publication journal and private .artisan paths on disk"

  - touches: "docker/network/**"
    updates:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs-site/src/content/docs/getting-started/install-admin.md"
    reason: "Hub + leaf example (commands section, network setup guide)"

  # --- Editor ---

  - touches: "editor/src/features/canvas/**"
    updates:
      - "docs/architecture/editor-internals.md"
      - "docs-site/src/content/docs/editor/"
    reason: "Canvas internals + user-visible editor UX"

  - touches: "editor/src/components/SchemaForm/"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "SchemaForm is the module form multiplier"

  - touches: "editor/src/components/ui/"
    updates:
      - "editor/src/features/design-system/DesignSystemPage.tsx"
      - "docs/architecture/editor-internals.md"
    reason: "Design system: a new/changed component needs its specimen on /design in the same commit"

  - touches: "editor/src/styles/globals.css"
    updates:
      - "editor/src/features/design-system/DesignSystemPage.tsx"
      - "docs/architecture/editor-internals.md"
    reason: "Tokens and utility classes are part of the design system surface"

  - touches: "editor/src/components/ProjectTabs.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "UI shell — project tab structure"

  - touches: "editor/src/features/project/publish/**"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "Publish workflow (deploy CAS, conflict sources, review)"

  - touches: "editor/src/components/ProjectSidebar.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "UI shell — sidebar structure"

  - touches: "editor/src/routes/settings.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
      - "docs-site/src/content/docs/editor/"
    reason: "/settings is user-facing — section list + Apparence flow"

  - touches: "editor/src/routes/networks.$networkId.servers.$serverId.projects.$projectId.tsx"
    updates:
      - "docs/architecture/editor-internals.md"
    reason: "Project shell layout (top bar + tab strip + content per ?tab=)"

  # --- Schemas, stack, config ---

  - touches: "docs/schema/**/schema.json"
    updates:
      - "docs/architecture/schemas-codegen.md"
      - "CHANGELOG.md"
    reason: "Types are hand-aligned (editor types.ts + plugin) and fixtures must stay green; a shipped version is never edited, it gets a new folder"

  - touches: "docker-compose.yml"
    updates:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs-site/src/content/docs/contributing/"
    reason: "Stack layout (commands section + contributing guide)"

  - touches: "*/package.json"
    updates:
      - "docs/decisions/stack.md"
    reason: "Dependency / stack change — add to the Pivots table if it reverses a choice"

  - touches: "CONTEXT.md"
    updates: []
    reason: "Glossary is the source of truth for terms — nothing downstream to sync, but code should follow it"
