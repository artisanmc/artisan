<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artisan — Title Composer</title>
<link rel="stylesheet" href="../styles/artisan.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app { display: flex; height: 100vh; }
  .side { width: 200px; flex-shrink: 0; background: var(--bg-deep); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 14px; padding: 14px 12px; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  .side-brand .nm { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
  .side-h { font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-faint); font-weight: 700; padding: 2px 8px 8px; }
  .ws-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--r-sm); font-size: 13px; color: var(--ink-2); }
  .ws-item.is-active { background: var(--terra-soft); color: var(--ink); }
  .ico { width: 15px; height: 15px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--bg-deep); border-bottom: 1px solid var(--line-soft); }
  .pack-name { flex: 1; font-family: var(--font-mono); font-size: 13px; }
  .tabbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line-soft); background: var(--bg); }

  .split { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; position: relative; background: radial-gradient(circle at 1px 1px, rgba(230,203,159,.06) 1px, transparent 0) 0 0 / 22px 22px, var(--inset); display: grid; place-items: center; }

  /* composed menu preview */
  .compose { width: 360px; border-radius: var(--r-lg); background: linear-gradient(180deg, var(--raised), var(--card)); border: 1px solid var(--line); box-shadow: var(--sh-3); padding: 26px; position: relative; }
  .layer-img { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; border-radius: 12px; background: radial-gradient(circle at 40% 30%, #e8b888, #8a5a3a); display: grid; place-items: center; image-rendering: pixelated; }
  .layer-img svg { width: 54px; height: 54px; }
  .layer-text { text-align: center; margin-top: 96px; font-family: var(--font-display); font-size: 26px; color: var(--sand); position: relative; }
  /* selection box on the text layer */
  .sel-box { position: absolute; inset: 92px 30px auto 30px; height: 44px; border: 1.5px solid var(--terra); border-radius: 6px; pointer-events: none; }
  .handle { position: absolute; width: 9px; height: 9px; background: var(--terra); border: 1.5px solid var(--bg); border-radius: 2px; }
  .h-tl { top: -5px; left: -5px; } .h-tr { top: -5px; right: -5px; } .h-bl { bottom: -5px; left: -5px; } .h-br { bottom: -5px; right: -5px; }
  .subtitle-text { text-align: center; margin-top: 8px; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-mut); }

  /* MenuProperties pane */
  .pane { width: 270px; flex-shrink: 0; border-left: 1px solid var(--line-soft); background: var(--raised); display: flex; flex-direction: column; }
  .pane-tabs { height: 42px; display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
  .utab { background: none; border: none; padding: 8px 2px; color: var(--ink-mut); font-size: 12.5px; font-weight: 600; position: relative; }
  .utab.on { color: var(--ink); }
  .utab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--sage); }
  .pane-body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .fg { display: flex; flex-direction: column; gap: 7px; }
  .frow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

  /* LayersPanel (3rd column) */
  .layers { width: 280px; flex-shrink: 0; border-left: 1px solid var(--line-soft); background: var(--bg-deep); display: flex; flex-direction: column; }
  .layers-h { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
  .layers-h .t { font-family: var(--font-mono); font-size: 12px; }
  .add-layers { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .add-layers .btn { flex: 1; }
  .layer-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
  .ll-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line-soft); }
  .ll-item.sel { border-color: var(--terra-line); }
  .ll-item .grip { color: var(--ink-faint); }
  .ll-item .lico { width: 16px; height: 16px; color: var(--terra); }
  .ll-item .nm { flex: 1; font-size: 12.5px; }
  .ll-item .del { color: var(--ink-faint); cursor: pointer; }
  .layer-edit { margin-top: auto; border-top: 1px solid var(--line-soft); padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--raised); }
  .le-h { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mut); font-weight: 700; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { width: 38px; height: 22px; border-radius: var(--r-pill); background: var(--terra); position: relative; }
  .switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .sizesel { display: flex; gap: 4px; }
  .sizesel button { flex: 1; height: 30px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font-size: 12px; }
  .sizesel button.on { border-color: var(--terra-line); background: var(--terra-soft); color: var(--terra); }
</style>
</head>
<body class="grain">
<div class="app" data-screen-label="Title composer">
  <aside class="side">
    <div class="side-brand"><span class="pixel-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="nm">Artisan</span></div>
    <div><div class="side-h">Workspaces</div>
      <div class="ws-item is-active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>menu_principal</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar"><div class="pack-name">menu_principal</div><button class="btn btn-deploy btn-sm">Déployer</button></div>
    <div class="tabbar"><button class="tab is-active">Overview</button><button class="tab">Translations <span class="badge badge-amber">4</span></button><button class="tab">Data-Sources</button></div>

    <div class="split">
      <!-- STAGE -->
      <div class="stage">
        <div class="compose">
          <div class="layer-img"><svg viewBox="0 0 24 24"><path fill="#7a4a2a" d="M4 8h16v3H4z"/><path fill="#e8b888" d="M5 11h14v9H5z"/><path fill="#c89060" d="M11 11h2v9h-2z"/></svg></div>
          <div class="layer-text">⚔ Menu Principal</div>
          <div class="subtitle-text">l'atelier du serveur</div>
          <div class="sel-box"><span class="handle h-tl"></span><span class="handle h-tr"></span><span class="handle h-bl"></span><span class="handle h-br"></span></div>
        </div>
      </div>

      <!-- MenuProperties pane -->
      <div class="pane">
        <div class="pane-tabs"><button class="utab on">Edit</button><button class="utab">Library</button><button class="utab">Assets</button></div>
        <div class="pane-body">
          <div class="fg"><label class="field-label">Menu ID</label><input class="input" value="main_menu"></div>
          <div class="fg"><label class="field-label">Titre (legacy)</label><input class="input" value="⚔ Menu Principal"></div>
          <div class="fg"><label class="field-label">Type</label><select class="select"><option>Chest · 6 lignes</option></select></div>
          <div class="rule"></div>
          <p style="font-size:12px; color:var(--ink-mut); line-height:1.6">Ce menu utilise des <strong style="color:var(--ink)">layers de titre</strong>. Édite-les dans le panneau Layers →</p>
        </div>
      </div>

      <!-- LayersPanel -->
      <div class="layers">
        <div class="layers-h"><span class="t">Layers</span><span class="faint" style="font-size:11px">3</span></div>
        <div class="add-layers">
          <button class="btn btn-sm"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg> Image</button>
          <button class="btn btn-sm"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg> Text</button>
        </div>
        <div class="layer-list">
          <div class="ll-item"><svg class="grip ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg><svg class="lico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span class="nm">title_bg</span><span class="del">×</span></div>
          <div class="ll-item sel"><svg class="grip ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg><svg class="lico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span class="nm">titre_principal</span><span class="del">×</span></div>
          <div class="ll-item"><svg class="grip ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg><svg class="lico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg><span class="nm">sous_titre</span><span class="del">×</span></div>
        </div>

        <!-- LayerEditForm -->
        <div class="layer-edit">
          <div class="le-h">Layer Text · titre_principal</div>
          <div class="fg"><label class="field-label">Contenu (MiniMessage)</label><textarea class="textarea">&lt;gradient:#E6CB9F:#D67E58&gt;⚔ Menu Principal&lt;/gradient&gt;</textarea></div>
          <div class="frow2">
            <div class="fg"><label class="field-label">X</label><input class="input" value="128"></div>
            <div class="fg"><label class="field-label">Y</label><input class="input" value="14"></div>
          </div>
          <div class="fg"><label class="field-label">Taille de police</label>
            <div class="sizesel"><button>S</button><button>M</button><button class="on">L</button><button>XL</button></div>
          </div>
          <div class="toggle-row"><span style="font-size:12.5px">Calibrer pour coffre (ascent −11)</span><span class="switch"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
