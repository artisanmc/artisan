<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artisan — Connexion</title>
<link rel="stylesheet" href="../styles/artisan.css">
<style>
  html, body { min-height: 100%; }
  .auth-stage { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }

  /* left poster */
  .poster { position: relative; overflow: hidden; background:
      radial-gradient(120% 90% at 20% 10%, rgba(214,126,88,.18), transparent 55%),
      radial-gradient(100% 80% at 90% 90%, rgba(135,160,107,.12), transparent 55%),
      var(--bg-deep);
    display: flex; flex-direction: column; justify-content: space-between; padding: 44px; }
  .poster .brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
  .poster .brand .nm { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
  .poster-art { position: absolute; inset: 0 0 200px; display: grid; place-items: center; }
  .poster-quote { position: relative; z-index: 2; max-width: 22ch; }
  .poster-quote .big { font-family: var(--font-display); font-size: 32px; line-height: 1.12; letter-spacing: -.01em; max-width: 28ch; }
  .poster-quote .big em { font-style: italic; color: var(--terra); }
  .poster-quote .by { margin-top: 16px; font-size: 13px; color: var(--ink-mut); }

  /* floating chest preview */
  .chest { width: 264px; border-radius: var(--r-lg); background: linear-gradient(180deg, var(--raised), var(--card)); border: 1px solid var(--line); box-shadow: var(--sh-3); transform: rotate(-4deg); opacity: .9; }
  .chest .tt { text-align: center; padding: 13px; font-family: var(--font-display); font-size: 17px; color: var(--sand); border-bottom: 1px solid var(--line-soft); }
  .chest .gr { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; padding: 14px; }
  .chest .sl { aspect-ratio: 1; border-radius: 6px; background: var(--inset); border: 1px solid var(--line-soft); }
  .chest .sl .m { width: 100%; height: 100%; border-radius: 5px; }

  /* right form */
  .form-side { display: flex; align-items: center; justify-content: center; padding: 40px; }
  .form-card { width: 100%; max-width: 380px; }
  .form-card h1 { font-family: var(--font-display); font-size: 34px; font-weight: 500; margin-bottom: 6px; }
  .form-card .sub { color: var(--ink-mut); font-size: 14px; margin-bottom: 30px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .err { font-size: 12.5px; color: var(--brick); background: var(--brick-soft); border: 1px solid rgba(203,94,80,.3); padding: 9px 12px; border-radius: var(--r-sm); }
  .or { display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin: 4px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .discord { background: #5865F2; color: #fff; border-color: transparent; }
  .discord:hover { background: #4a55d6; border-color: transparent; }
  .swlink { text-align: center; font-size: 13px; color: var(--ink-mut); margin-top: 22px; }
  .swlink a { color: var(--terra); text-decoration: none; font-weight: 600; }

  .toggle { position: fixed; top: 20px; right: 24px; z-index: 10; display: flex; gap: 4px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 4px; }
  .toggle button { height: 28px; padding: 0 14px; border-radius: var(--r-pill); border: none; background: none; color: var(--ink-mut); font-size: 12px; font-weight: 600; }
  .toggle button.on { background: var(--terra-soft); color: var(--terra); }
</style>
</head>
<body class="grain">
<div class="toggle">
  <button class="on" onclick="show('login')" id="t-login">Connexion</button>
  <button onclick="show('signup')" id="t-signup">Inscription</button>
</div>

<div class="auth-stage" data-screen-label="Auth">
  <!-- POSTER -->
  <div class="poster">
    <div class="brand">
      <span class="pixel-mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="nm">Artisan</span>
    </div>
    <div class="poster-art">
      <div class="chest">
        <div class="tt">⚔ Menu Principal</div>
        <div class="gr">
          <div class="sl"></div><div class="sl"><span class="m" style="background:linear-gradient(135deg,#8a5a3a,#5e3a24)"></span></div><div class="sl"></div>
          <div class="sl"><span class="m" style="background:linear-gradient(135deg,#6a8a4a,#3f5a2a)"></span></div><div class="sl"></div><div class="sl"><span class="m" style="background:linear-gradient(135deg,#caa24a,#8a6a20)"></span></div>
          <div class="sl"></div><div class="sl"><span class="m" style="background:linear-gradient(135deg,#9a9a9a,#5a5a5a)"></span></div><div class="sl"></div>
          <div class="sl"></div><div class="sl"></div><div class="sl"><span class="m" style="background:linear-gradient(135deg,#b5503a,#7a2e1e)"></span></div>
          <div class="sl"></div><div class="sl"><span class="m" style="background:linear-gradient(135deg,#4a6a8a,#2a3f5e)"></span></div><div class="sl"></div>
          <div class="sl"></div><div class="sl"></div><div class="sl"></div>
        </div>
      </div>
    </div>
    <div class="poster-quote">
      <div class="big">Forge des menus <em>sans écrire</em> une ligne de YAML.</div>
      <div class="by">L'éditeur visuel pour tes packs Minecraft.</div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-side">
    <!-- LOGIN -->
    <div class="form-card" id="login">
      <h1>Connexion</h1>
      <p class="sub">Content de te revoir à l'atelier.</p>
      <form class="stack" onsubmit="return false">
        <div>
          <label class="field-label">Email</label>
          <input class="input" type="email" placeholder="toi@serveur.gg" required>
        </div>
        <div>
          <label class="field-label">Mot de passe</label>
          <input class="input" type="password" placeholder="••••••••" minlength="8" required>
        </div>
        <button class="btn btn-primary" style="height:42px">Se connecter</button>
        <div class="or">ou</div>
        <button class="btn discord" style="height:42px">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19 19 0 0 0 15.7 3l-.2.5a14 14 0 0 1 4 2 13 13 0 0 0-11 0 14 14 0 0 1 4-2L12.3 3a19 19 0 0 0-4.6 1.4C4 9.7 3.3 14.9 3.6 20a19 19 0 0 0 5.7 2.9l.5-1.2c-.8-.3-1.5-.7-2.2-1.1l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.7.4-1.4.8-2.2 1.1l.5 1.2a19 19 0 0 0 5.7-2.9c.4-5.9-.7-11-3.6-15.6ZM9.5 16c-.9 0-1.7-.8-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.7 1.9-1.7 1.9Zm5 0c-.9 0-1.7-.8-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.7 1.9-1.7 1.9Z"/></svg>
          Continuer avec Discord
        </button>
      </form>
      <div class="swlink">Pas encore de compte ? <a onclick="show('signup')">Crée-en un</a></div>
    </div>

    <!-- SIGNUP -->
    <div class="form-card" id="signup" style="display:none">
      <h1>Inscription</h1>
      <p class="sub">Crée ton compte et lance ton premier pack.</p>
      <form class="stack" onsubmit="return false">
        <div>
          <label class="field-label">Nom</label>
          <input class="input" type="text" placeholder="Ton pseudo" required>
        </div>
        <div>
          <label class="field-label">Email</label>
          <input class="input" type="email" placeholder="toi@serveur.gg" required>
        </div>
        <div>
          <label class="field-label">Mot de passe</label>
          <input class="input" type="password" placeholder="8 caractères minimum" minlength="8" required>
        </div>
        <button class="btn btn-primary" style="height:42px">Créer mon compte</button>
        <div class="or">ou</div>
        <button class="btn discord" style="height:42px">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19 19 0 0 0 15.7 3l-.2.5a14 14 0 0 1 4 2 13 13 0 0 0-11 0 14 14 0 0 1 4-2L12.3 3a19 19 0 0 0-4.6 1.4C4 9.7 3.3 14.9 3.6 20a19 19 0 0 0 5.7 2.9l.5-1.2c-.8-.3-1.5-.7-2.2-1.1l.5-.4a13 13 0 0 0 11.8 0l.5.4c-.7.4-1.4.8-2.2 1.1l.5 1.2a19 19 0 0 0 5.7-2.9c.4-5.9-.7-11-3.6-15.6Z"/></svg>
          Continuer avec Discord
        </button>
      </form>
      <div class="swlink">Déjà un compte ? <a onclick="show('login')">Connecte-toi</a></div>
    </div>
  </div>
</div>

<script>
  function show(which){
    document.getElementById('login').style.display = which==='login'?'block':'none';
    document.getElementById('signup').style.display = which==='signup'?'block':'none';
    document.getElementById('t-login').classList.toggle('on', which==='login');
    document.getElementById('t-signup').classList.toggle('on', which==='signup');
  }
</script>
</body>
</html>
