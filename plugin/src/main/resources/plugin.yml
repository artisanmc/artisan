name: Artisan
version: '${version}'
main: net.artisanmc.plugin.ArtisanPlugin
api-version: '1.21'
softdepend: [Vault, PlaceholderAPI, WorldGuard, Nexo, Oraxen, ItemsAdder, HeadDatabase]
description: Artisan GUI editor plugin
commands:
  artisan:
    description: Artisan commands
    usage: /artisan <menu <id>|reload|sync <status|reject>|link <CODE>|editor|member add <email>|pushLocal <id|--all>>
permissions:
  artisan.editor:
    description: Allows opening the Artisan web editor
    default: op
