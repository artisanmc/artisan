  rollback_header: "<aqua>[Artisan] </aqua><green>Rollback of batch {batch} ({source}):</green>"
  count_line: "<gray>-</gray> <white>{label}</white><gray>:</gray> <white>{count}</white>"
  already: "<gray>- already imported, skipped: {count}</gray>"
  rejected_header: "<yellow>{count} record(s) left aside:</yellow>"
  rejected_line: "<gray>-</gray> <yellow>{code}</yellow> <gray>×{count}: {message} ({ids})</gray>"
  blocker: "<red>Blocked: {message}</red>"
  note: "<gray>· {message}</gray>"
  nothing_written: "<red>Nothing was written. Fix what blocks, then run it again.</red>"
  confirm_hint: "<gray>Add <white>confirm</white> to write: /artisan import {source} confirm</gray>"
  applied_done: "<green>Done, batch <white>{batch}</white>. Undo what is untouched with /artisan import rollback {batch}</green>"
  rollback_confirm_hint: "<gray>Add <white>confirm</white> to undo: /artisan import rollback {batch} confirm</gray>"
  nothing_new: "<green>Nothing new: everything was already imported.</green>"
  rollback_nothing: "<gray>Nothing to undo in this batch.</gray>"
  rollback_done: "<green>Rollback done. What players changed since the import was kept.</green>"
  history_empty: "<aqua>[Artisan] </aqua><gray>No import run yet.</gray>"
  history_header: "<aqua>[Artisan] </aqua><green>Last import runs:</green>"
  history_line: "<gray>{at}</gray> <white>{action}</white> <gray>{source}</gray> <white>{batch}</white> <gray>{applied} {actor}</gray>"
  refused:
    unknown_source: "<red>[Artisan] Unknown import source: {source}. See /artisan import list</red>"
    busy: "<red>[Artisan] An import of {module} is already running.</red>"
    conflict_running: "<red>[Artisan] {plugin} is running: remove it and restart first, or items could be handed out on both sides. A dry run works meanwhile.</red>"
    file_required: "<red>[Artisan] {source} reads a file: /artisan import {source} <file> (in plugins/Artisan/imports/)</red>"
    bad_file: "<red>[Artisan] {file} is not a file of plugins/Artisan/imports/.</red>"
    unknown_batch: "<red>[Artisan] No applied import has the batch {batch}. See /artisan import history</red>"
    failed: "<red>[Artisan] The import failed: {error}. What was written is kept; running it again resumes.</red>"
