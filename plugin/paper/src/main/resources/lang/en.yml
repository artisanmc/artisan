arg:
  missing: "<red>Missing required argument: <yellow>{arg}</yellow></red>"
  not_integer: "<red>Argument <yellow>{arg}</yellow> must be a whole number, got: <yellow>{value}</yellow></red>"
  not_number: "<red>Argument <yellow>{arg}</yellow> must be a number, got: <yellow>{value}</yellow></red>"
  not_boolean: "<red>Argument <yellow>{arg}</yellow> expects true or false, got: <yellow>{value}</yellow></red>"
  player_offline: "<red>Player <yellow>{value}</yellow> is not online.</red>"
  world_not_loaded: "<red>World <yellow>{value}</yellow> is not loaded.</red>"
  unknown_material: "<red>Unknown material: <yellow>{value}</yellow></red>"
  invalid_enum: "<red>Invalid value for <yellow>{arg}</yellow>: <yellow>{value}</yellow>. Expected one of: <yellow>{values}</yellow></red>"
action:
  inventory_full: "<yellow>Your inventory is full: the rest was dropped at your feet.</yellow>"
cmd:
  usage: "<red>Usage: /{command} ({subcommands})</red>"
  failed: "<red>This command failed. The error is in the server log.</red>"
  in_game_only: "<red>This command can only be used in-game.</red>"
  no_permission: "<red>You don't have permission to use this command.</red>"
  menu_not_found: "<red>Menu <yellow>{id}</yellow> not found.</red>"
  dialog_not_found: "<red>Dialog <yellow>{id}</yellow> not found.</red>"
artisan:
  in_game_only: "<red>In-game only.</red>"
  reloaded: "<green>Artisan reloaded.</green>"
  sync_status: "<gray>Check server logs for sync status details.</gray>"
  sync_reconnecting: "<gray>Reloading projects from disk.</gray>"
  usage_menu: "<red>Usage: /artisan menu <id></red>"
  usage_sync: "<red>Usage: /artisan sync <status|reject></red>"
  usage_editor: "<red>Usage: /artisan editor [logout [player]]</red>"
  editor_logged_out: "<aqua>[Artisan] </aqua><green>{count} editor session(s) closed for {player}.</green>"
  editor_unknown_player: "<red>[Artisan] Unknown player: {player}</red>"
  usage_main: "<red>Usage: /artisan <menu <id>|reload|sync <status|reject>|editor|dump-title <id>|update [plugin]></red>"
  editor_no_permission: "<red>[Artisan] Missing permission: artisan.editor</red>"
  editor_link: "<aqua>[Artisan] </aqua><green>Open the editor: <click:open_url:'{url}'><aqua><underlined>click here</underlined></aqua></click> <gray>(single use, valid 60 seconds)</gray></green>"
  editor_link_too_soon: "<yellow>[Artisan] A link was just generated. Try again in {seconds} s.</yellow>"
  editor_hub_offline: "<yellow>[Artisan] The editor hub cannot be reached right now. Try again in a few seconds, and check web.hub in environment.yml if this persists.</yellow>"
  editor_link_console: "[Artisan] Editor link, signed in as Console (single use, valid 60 seconds): {url}"
  editor_disabled: "<red>[Artisan] The web editor is not running on this server. Check web.enabled in environment.yml and the startup log.</red>"
  update_none: "<gray>[Artisan] No plugin of the suite names its releases (artisan-releases in its plugin.yml).</gray>"
  update_unknown: "<red>[Artisan] {plugin} does not name its releases.</red>"
  update_checking: "<gray>[Artisan] Checking the releases…</gray>"
  update_up_to_date: "<gray>[Artisan] {plugin} {version}: up to date.</gray>"
  update_available: "<yellow>[Artisan] {plugin} {installed} → {latest}: /artisan update {plugin} stages it for the next restart.</yellow>"
  update_staged: "<green>[Artisan] {plugin} {version} verified and staged as {file}: it applies at the next restart.</green>"
  update_failed: "<red>[Artisan] {plugin}: {reason}</red>"
  update_reason_unreachable: "the releases cannot be reached."
  update_reason_no_release: "no signed release (release.json and its jar) on the repository, or the repository is private."
  update_reason_not_newer: "the latest release is not newer than the installed version."
  update_reason_no_trusted_key: "this Artisan trusts no release key yet: nothing is staged."
  update_reason_bad_signature: "the signature or the jar does not match: refused."
  update_reason_mismatch: "the jar is not the plugin or version that was signed: refused."
  update_reason_too_large: "the jar is larger than 100 MB: refused."
  update_reason_write_failed: "the update folder cannot be written."
  prefix: "<aqua>[Artisan] </aqua>"
