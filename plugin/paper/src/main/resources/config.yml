# Server settings — editable by hand or from the editor's server page.
# The web editor, network and database settings live in environment.yml,
# which the editor never reads nor writes.

# Language for plugin system messages (en, fr). Defaults to en. Also the default
# of the suite's plugins that do not set their own.
# A plugins/Artisan/lang/<code>.yml overrides the keys it holds; a new <code>
# adds a language.
language: "en"

# When true, plugin messages are sent in each player's client language when
# a matching lang file is available. Falls back to 'language' if not.
per_player_language: false

# Artisan's resource pack (images, glyphs, fonts, composed titles).
# Two ways to reach players:
#   - delegation: with `delegate-to-dir` set, Artisan writes its pack into the
#     pack of a resource-pack plugin (Nexo, Oraxen, ItemsAdder), which merges
#     it into its own and sends it. Players see a single prompt.
#   - direct: without a delegate folder, Artisan sends its own pack to each
#     player, next to any other pack (1.20.3+ pack stack). Players download it
#     from the editor's web server: `web.url` in environment.yml must be
#     reachable from their machine (else http://<server-ip>:<web.port>).
resource-pack:
  # Direct sending only; ignored when `delegate-to-dir` is set. False: the
  # pack reaches no player unless delegated.
  enabled: true
  # Prompt shown by the client (MiniMessage). Empty: `resource_pack.prompt`
  # of the player's language (lang/<code>.yml).
  prompt: ""
  # True: a player who declines the pack is disconnected.
  required: false
  # Send the pack when a player joins, after this many ticks.
  send-on-join: true
  send-delay-ticks: 20
  # Where Artisan writes its pack (`assets/artisan/*`), inside the folder the
  # host plugin merges external packs from. Setting it turns delegation on.
  #
  # Output shape depends on the path suffix:
  #   - `<path>.zip`  → single zip file with `assets/artisan/*` and a
  #                     minimal pack.mcmeta. **Use this with Nexo's
  #                     pack/external_packs/** — its directory scanner skips
  #                     PNGs for non-vanilla namespaces, the zip-merger does
  #                     not.
  #   - `<path>`      → directory; Artisan writes under
  #                     `<path>/assets/artisan/` (wiped before each update).
  #
  # Path is filesystem-absolute or relative to the server root. A folder that
  # cannot be written falls back to direct sending (if `enabled`).
  #
  # Nexo example:
  #   delegate-to-dir: "plugins/Nexo/pack/external_packs/artisan.zip"
  #   delegate-reload-command: "n reload"
  # Oraxen example:
  #   delegate-to-dir: "plugins/Oraxen/pack/external_packs/artisan"
  #   delegate-reload-command: "oraxen reload pack"
  # ItemsAdder or another host: the folder it merges, and its reload command.
  delegate-to-dir: ""
  # Optional: command dispatched on the console after each pack update.
  # Use this to auto-reload the host RP plugin so players don't see missing
  # glyphs until they manually rejoin. Examples: "n reload" (Nexo),
  # "oraxen reload pack" (Oraxen).
  delegate-reload-command: ""
  # True: the pack empties the "Inventory" label the client writes under every
  # container window (the `container.inventory` translation, every language).
  # Meant for menus with `player_inventory: hidden`; it also removes the label
  # from every other chest, furnace… for players with the pack. Not written
  # when delegating (only `assets/artisan/` is).
  hide-inventory-label: false
  # The themes the common images are shown in, the lowest first: each the name
  # of a folder of `themes/artisan/themes/`. Every common image is then shown
  # in a theme's colours, or as the theme redraws it; a theme changes what the
  # ones before it show, so the last one that redraws an image wins. Empty: no
  # theme. The former `theme: "<name>"` is still read while this list is empty.
  themes: []
  # Textures drawn back on the other windows when a menu turns its vanilla
  # texture off (the pack makes that container transparent server-wide).
  # "project:image" names a project image in the vanilla layout (256×256 or an
  # HD multiple); empty = the vanilla texture.
  container-textures:
    chest: ""
    hopper: ""
    dispenser: ""

# Menu variants: which version of a module's menus, dialogs and command steps a
# player sees. Every server has three, which cannot be removed:
#   default   the module's own files.
#   bedrock   for Bedrock players (Geyser). Falls back to default.
#   textured  for Java players whose client loaded the server's resource pack.
#             Falls back to default; a refused or failed pack drops a player back
#             to default at the next menu they open.
# A module ships versions for them in variants/<name>/; a menu it has no version
# of comes from the variant's parent, down to the module's own file.
# A player can choose with `/artisan variant <name|auto>` (permission
# artisan.variant, granted by default): kept across restarts and servers.
#
# Declare your own here, each with a parent to fall back to. With `if`
# (conditions of an action's `if`, all required), it is picked automatically,
# before bedrock and textured, for the players it holds for; without, only the
# players who choose it see it. `selectable: false` keeps it out of the command.
#   menu-variants:
#     - name: large-text
#       parent: default
#     - name: vip
#       parent: textured
#       if: [{ has_permission: rank.vip }]
#       selectable: false

# The server's text palette: colors and gradients the editor's MiniMessage
# toolbar offers in every module, beside the built-in Minecraft and Artisan
# palettes. Editor-only: applying one writes its colors into the text
# (`<color:#ff6b35>`), so changing the palette never changes existing texts.
#   colors:    "<name> #rrggbb"                  e.g. "Brand #ff6b35"
#   gradients: "<name> #rrggbb #rrggbb [...]"    e.g. "Sunset #ff5f6d #ffc371"
text-palette:
  colors: []
  gradients: []

# Statistics: what players do (sessions, commands, menus, what modules and your
# own `record_event` actions record), kept in the database of environment.yml
# and read in the editor with the permission artisan.editor.stats. Nothing
# leaves this server, except the player metrics (play time, money...) pushed to
# your website when `stats-export` is set in environment.yml.
# `/artisan stats forget <player>` erases a player's.
stats:
  # False: nothing is recorded and the editor shows no statistics.
  enabled: true
  # Records wait in memory and are written this often (5 to 600 seconds).
  flush-seconds: 30
  retention:
    # Counts are kept per hour this many days, then merged per day.
    hourly-days: 90
    # Days are kept this many days; 0 keeps them forever.
    daily-days: 0
    # Events kept one by one (sessions, completions) are deleted after this many days.
    raw-days: 90
  # Where a day starts (Europe/Paris, America/New_York...). Empty: the machine's zone.
  timezone: ""
  # Events to stop recording, by name: ["core:menu_click", "custom:my_event"].
  disabled-events: []
