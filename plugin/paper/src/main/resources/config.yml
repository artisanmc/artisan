# Server settings — editable by hand or from the editor's server page.
# The web editor, network and database settings live in environment.yml,
# which the editor never reads nor writes.

# Language for plugin system messages (en, fr). Defaults to en. Also the default
# of the suite's plugins that do not set their own.
# A plugins/Artisan/lang/<code>.yml overrides the keys it holds; a new <code>
# adds a language.
language: "en"

# When true, plugin messages are sent in each player's client language when
# a matching lang file is available. Falls back to 'language' if not.
per_player_language: false

# Artisan's resource pack (images, glyphs, fonts, composed titles).
# Artisan never sends a pack to players itself: it writes its pack into the
# pack of a resource-pack plugin (Nexo, Oraxen, ItemsAdder), which merges it
# into its own and sends it to players.
resource-pack:
  # Where Artisan writes its pack (`assets/artisan/*`), inside the folder the
  # host plugin merges external packs from.
  #
  # Without it, Artisan's textures and glyphs reach no player, and the
  # console says so on every pack update.
  #
  # Output shape depends on the path suffix:
  #   - `<path>.zip`  → single zip file with `assets/artisan/*` and a
  #                     minimal pack.mcmeta. **Use this with Nexo's
  #                     pack/external_packs/** — its directory scanner skips
  #                     PNGs for non-vanilla namespaces, the zip-merger does
  #                     not.
  #   - `<path>`      → directory; Artisan writes under
  #                     `<path>/assets/artisan/` (wiped before each update).
  #
  # Path is filesystem-absolute or relative to the server root.
  #
  # Nexo example:
  #   delegate-to-dir: "plugins/Nexo/pack/external_packs/artisan.zip"
  #   delegate-reload-command: "n reload"
  # Oraxen example:
  #   delegate-to-dir: "plugins/Oraxen/pack/external_packs/artisan"
  #   delegate-reload-command: "oraxen reload pack"
  # ItemsAdder or another host: the folder it merges, and its reload command.
  delegate-to-dir: ""
  # Optional: command dispatched on the console after each pack update.
  # Use this to auto-reload the host RP plugin so players don't see missing
  # glyphs until they manually rejoin. Examples: "n reload" (Nexo),
  # "oraxen reload pack" (Oraxen).
  delegate-reload-command: ""
  # Textures drawn back on the other windows when a menu turns its vanilla
  # texture off (the pack makes that container transparent server-wide).
  # "project:image" names a project image in the vanilla layout (256×256 or an
  # HD multiple); empty = the vanilla texture.
  container-textures:
    chest: ""
    hopper: ""
    dispenser: ""
